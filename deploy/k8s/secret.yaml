# Template secret. Create a real one with:
#   kubectl create secret generic gobivc-secrets -n gobivc \
#     --from-literal=anthropic-api-key=sk-ant-xxxxx \
#     --from-literal=api-token=your-random-token
apiVersion: v1
kind: Secret
metadata:
  name: gobivc-secrets
  namespace: gobivc
type: Opaque
stringData:
  anthropic-api-key: "REPLACE_WITH_YOUR_KEY"
  api-token: "REPLACE_WITH_RANDOM_TOKEN"
