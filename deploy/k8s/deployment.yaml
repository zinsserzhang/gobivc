apiVersion: apps/v1
kind: Deployment
metadata:
  name: gobivc
  namespace: gobivc
  labels:
    app: gobivc
spec:
  replicas: 1
  strategy:
    type: Recreate  # SQLite requires single writer
  selector:
    matchLabels:
      app: gobivc
  template:
    metadata:
      labels:
        app: gobivc
    spec:
      containers:
        - name: gobivc
          image: ghcr.io/zinsserzhang/gobivc:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: "/app/data"
            - name: ANTHROPIC_MODEL
              value: "claude-sonnet-4-20250514"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gobivc-secrets
                  key: anthropic-api-key
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gobivc-secrets
                  key: api-token
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gobivc-data
