<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GobiVC - 投研工作台</title>
    <link rel="stylesheet" href="/static/css/style.css?v=2">
</head>
<body>
    <div id="app">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1 class="logo">GobiVC</h1>
                <p class="logo-sub">投研工作台</p>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section-label">生成</div>
                <button class="nav-btn active" data-view="create-predd" onclick="openCreate('predd')">
                    <span class="nav-icon">&#9745;</span>
                    <span class="nav-text">Pre-DD 尽调</span>
                </button>
                <button class="nav-btn" data-view="create-memo" onclick="openCreate('memo')">
                    <span class="nav-icon">&#128221;</span>
                    <span class="nav-text">立项报告</span>
                </button>
                <button class="nav-btn" data-view="create-financial" onclick="openCreate('financial')">
                    <span class="nav-icon">&#128200;</span>
                    <span class="nav-text">财务分析</span>
                </button>
                <button class="nav-btn" data-view="create-industry" onclick="openCreate('industry')">
                    <span class="nav-icon">&#128202;</span>
                    <span class="nav-text">行业研究报告</span>
                </button>

                <div class="nav-section-label" style="margin-top:16px">管理</div>
                <button class="nav-btn" data-view="list" onclick="switchView('list')">
                    <span class="nav-icon">&#128196;</span>
                    <span class="nav-text">全部报告</span>
                </button>
            </nav>
            <div class="sidebar-footer">
                <button class="nav-btn" onclick="promptForToken()">
                    <span class="nav-icon">&#9881;</span>
                    <span class="nav-text">API Token</span>
                </button>
            </div>
        </aside>

        <div class="mobile-topbar">
            <button class="mobile-menu-btn" onclick="toggleSidebar()">&#9776;</button>
            <span class="mobile-title">GobiVC</span>
        </div>

        <main class="main-content" id="main-content">

            <!-- Unified Create View -->
            <div id="view-create" class="view active">
                <div class="page-header" id="create-header">
                    <h2>行业研究报告</h2>
                    <p>配置研究参数，AI 将为您生成专业的行业研究报告</p>
                </div>

                <form id="report-form" class="report-form" onsubmit="handleSubmit(event)">
                    <input type="hidden" id="report-type" name="report_type" value="industry">

                    <div class="form-group">
                        <label for="topic" id="topic-label">研究主题 <span class="required">*</span></label>
                        <input type="text" id="topic" name="topic" autocomplete="off"
                               placeholder="输入行业或细分领域..." required>
                        <div class="topic-suggestions" id="topic-suggestions">
                            <div class="suggestions-label">热门研究方向</div>
                            <div class="suggestions-tags">
                                <button type="button" class="tag" onclick="fillTopic('人工智能')">人工智能</button>
                                <button type="button" class="tag" onclick="fillTopic('新能源汽车')">新能源汽车</button>
                                <button type="button" class="tag" onclick="fillTopic('半导体')">半导体</button>
                                <button type="button" class="tag" onclick="fillTopic('生物医药')">生物医药</button>
                                <button type="button" class="tag" onclick="fillTopic('机器人')">机器人</button>
                                <button type="button" class="tag" onclick="fillTopic('低空经济')">低空经济</button>
                                <button type="button" class="tag" onclick="fillTopic('量子计算')">量子计算</button>
                                <button type="button" class="tag" onclick="fillTopic('储能')">储能</button>
                                <button type="button" class="tag" onclick="fillTopic('SaaS')">SaaS</button>
                                <button type="button" class="tag" onclick="fillTopic('大模型')">大模型</button>
                                <button type="button" class="tag" onclick="fillTopic('Web3')">Web3</button>
                                <button type="button" class="tag" onclick="fillTopic('合成生物学')">合成生物学</button>
                            </div>
                        </div>
                    </div>

                    <div class="form-group" id="direction-group">
                        <label for="direction" id="direction-label">研究方向</label>
                        <input type="text" id="direction" name="direction" autocomplete="off"
                               placeholder="例如：市场规模与增长趋势、竞争格局分析...">
                        <span class="form-hint" id="direction-hint">可选，指定报告的重点分析方向</span>
                    </div>

                    <div class="form-group">
                        <label>报告深度</label>
                        <div class="depth-selector">
                            <label class="depth-option">
                                <input type="radio" name="depth" value="brief">
                                <div class="depth-card">
                                    <div class="depth-icon">&#9997;</div>
                                    <div class="depth-title">概览</div>
                                    <div class="depth-desc">~2,000 字</div>
                                    <div class="depth-detail">快速概览<br>适合初步了解</div>
                                    <div class="depth-time">预计 1-2 分钟</div>
                                </div>
                            </label>
                            <label class="depth-option">
                                <input type="radio" name="depth" value="standard" checked>
                                <div class="depth-card">
                                    <div class="depth-icon">&#128202;</div>
                                    <div class="depth-title">标准</div>
                                    <div class="depth-desc">~5,000 字</div>
                                    <div class="depth-detail">全面分析<br>涵盖核心维度</div>
                                    <div class="depth-time">预计 2-4 分钟</div>
                                </div>
                            </label>
                            <label class="depth-option">
                                <input type="radio" name="depth" value="deep">
                                <div class="depth-card">
                                    <div class="depth-icon">&#128218;</div>
                                    <div class="depth-title">深度</div>
                                    <div class="depth-desc">~10,000 字</div>
                                    <div class="depth-detail">详尽深度分析<br>适合决策</div>
                                    <div class="depth-time">预计 4-8 分钟</div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- File Upload -->
                    <div class="form-group" id="file-upload-group" style="display:none">
                        <label>上传项目材料</label>
                        <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()"
                             ondragover="event.preventDefault(); this.classList.add('drag-over')"
                             ondragleave="this.classList.remove('drag-over')"
                             ondrop="handleDrop(event)">
                            <input type="file" id="file-input" multiple accept=".pdf,.docx,.doc,.pptx,.txt,.md,.csv"
                                   onchange="handleFileSelect(event)" style="display:none">
                            <div class="upload-icon">&#128194;</div>
                            <p>点击上传或拖拽文件到此处</p>
                            <p class="upload-hint">支持 PDF、DOCX、PPTX、TXT 等格式，单文件最大 50MB</p>
                        </div>
                        <div class="file-list" id="file-list"></div>
                        <span class="form-hint">上传 BP、Datapack、财务报表等项目材料</span>
                    </div>

                    <!-- Feishu integration -->
                    <div class="form-group feishu-group" id="feishu-group" style="display:none">
                        <label>
                            <span class="feishu-label">
                                <svg width="18" height="18" viewBox="0 0 24 24" style="vertical-align:middle;margin-right:4px"><path fill="#3370ff" d="M7.94 3.58a.75.75 0 0 0-1.06 0L3.58 6.88a.75.75 0 0 0 0 1.06l3.3 3.3a.75.75 0 0 0 1.06 0l3.3-3.3a.75.75 0 0 0 0-1.06L7.94 3.58zM16.06 3.58a.75.75 0 0 1 1.06 0l3.3 3.3a.75.75 0 0 1 0 1.06l-3.3 3.3a.75.75 0 0 1-1.06 0l-3.3-3.3a.75.75 0 0 1 0-1.06l3.3-3.3zM7.94 12.76a.75.75 0 0 0-1.06 0l-3.3 3.3a.75.75 0 0 0 0 1.06l3.3 3.3a.75.75 0 0 0 1.06 0l3.3-3.3a.75.75 0 0 0 0-1.06l-3.3-3.3zM16.06 12.76a.75.75 0 0 1 1.06 0l3.3 3.3a.75.75 0 0 1 0 1.06l-3.3 3.3a.75.75 0 0 1-1.06 0l-3.3-3.3a.75.75 0 0 1 0-1.06l3.3-3.3z"/></svg>
                                飞书知识库参考
                            </span>
                        </label>
                        <div class="feishu-toggle">
                            <label class="toggle-switch">
                                <input type="checkbox" id="use-feishu" name="use_feishu">
                                <span class="toggle-slider"></span>
                            </label>
                            <span class="feishu-desc">自动检索飞书中与主题相关的研究材料作为参考</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="custom_notes">特别要求</label>
                        <textarea id="custom_notes" name="custom_notes" rows="3"
                                  placeholder="例如：请重点分析中国市场、关注近一年最新动态..."></textarea>
                        <span class="form-hint">可选，添加您希望关注的特定方面</span>
                    </div>

                    <button type="submit" class="btn-primary btn-generate" id="btn-submit">
                        <span class="btn-text">生成报告</span>
                        <span class="btn-loading" style="display:none">
                            <span class="spinner-inline"></span> 提交中...
                        </span>
                    </button>
                </form>
            </div>

            <!-- Report List View -->
            <div id="view-list" class="view">
                <div class="page-header">
                    <h2>全部报告</h2>
                    <p>查看和管理已生成的报告</p>
                </div>
                <!-- Type tabs -->
                <div class="type-tabs" id="type-tabs">
                    <button class="type-tab active" data-type="" onclick="filterByType('')">全部</button>
                    <button class="type-tab" data-type="predd" onclick="filterByType('predd')">&#9745; Pre-DD 尽调</button>
                    <button class="type-tab" data-type="memo" onclick="filterByType('memo')">&#128221; 立项报告</button>
                    <button class="type-tab" data-type="financial" onclick="filterByType('financial')">&#128200; 财务分析</button>
                    <button class="type-tab" data-type="industry" onclick="filterByType('industry')">&#128202; 行业研究</button>
                </div>
                <div class="list-toolbar">
                    <div class="search-box">
                        <span class="search-icon">&#128269;</span>
                        <input type="text" id="search-input" placeholder="搜索报告..."
                               oninput="debounceSearch()">
                        <button class="search-clear" id="search-clear" onclick="clearSearch()" style="display:none">&#10005;</button>
                    </div>
                    <div class="filter-group">
                        <select id="filter-status" onchange="applyFilters()">
                            <option value="">所有状态</option>
                            <option value="completed">已完成</option>
                            <option value="generating">生成中</option>
                            <option value="failed">失败</option>
                        </select>
                        <select id="sort-order" onchange="applyFilters()">
                            <option value="newest">最新优先</option>
                            <option value="oldest">最早优先</option>
                        </select>
                    </div>
                </div>
                <div class="list-stats" id="list-stats"></div>
                <div id="report-list" class="report-list">
                    <div class="empty-state">
                        <div class="empty-icon">&#128196;</div>
                        <p>暂无报告</p>
                        <p class="empty-sub">从左侧选择类型开始创建</p>
                    </div>
                </div>
            </div>

            <!-- Report Detail View -->
            <div id="view-detail" class="view">
                <div class="detail-toolbar">
                    <button class="btn-back" onclick="switchView('list')">&#8592; 返回列表</button>
                    <div class="detail-actions" id="detail-actions"></div>
                </div>
                <div class="detail-meta" id="detail-meta"></div>
                <div class="report-detail" id="report-detail">
                    <nav class="report-toc" id="report-toc"></nav>
                    <div class="report-body" id="report-body"></div>
                </div>
            </div>

            <!-- Generating View -->
            <div id="view-generating" class="view">
                <div class="generating-header">
                    <div class="generating-status">
                        <div class="spinner-sm"></div>
                        <span>正在生成: <strong id="generating-topic"></strong></span>
                        <span class="generating-time" id="generating-time">0秒</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>
                <div class="stream-output report-detail" id="stream-output">
                    <div class="report-body">
                        <div class="stream-placeholder">
                            <div class="stream-placeholder-icon">&#129302;</div>
                            <p>AI 正在分析数据并撰写内容</p>
                            <p class="stream-placeholder-sub">内容将实时显示在此处...</p>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="/static/js/app.js?v=2"></script>
</body>
</html>
