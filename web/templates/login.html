<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GobiVC 登录</title>
    <link rel="stylesheet" href="/static/css/style.css?v=9">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
        }
        .login-card {
            width: 420px;
            max-width: calc(100vw - 32px);
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 36px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.35);
            text-align: center;
        }
        .login-logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            border-radius: 16px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: #fff;
            font-size: 32px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-title {
            margin: 0 0 8px;
            font-size: 22px;
            color: #0f172a;
        }
        .login-sub {
            margin: 0 0 28px;
            color: #64748b;
            font-size: 14px;
        }
        .login-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 20px;
            border-radius: 10px;
            border: none;
            background: #00d6b9;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        .login-btn:hover { background: #00b89e; }
        .login-btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .login-btn svg { width: 22px; height: 22px; }
        .login-hint {
            margin-top: 20px;
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.6;
        }
        .error-box {
            margin: 0 0 20px;
            padding: 12px 14px;
            border-radius: 8px;
            background: #fef2f2;
            color: #b91c1c;
            font-size: 13px;
            text-align: left;
            display: none;
        }
        .error-box.visible { display: block; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">G</div>
        <h1 class="login-title">GobiVC 投研工作台</h1>
        <p class="login-sub">使用飞书账号登录继续</p>

        <div id="error-box" class="error-box"></div>

        <button id="login-btn" class="login-btn" type="button">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm3.55 14.5L12 14.1l-3.55 2.4.9-4.1-3.05-2.7 4.15-.35L12 5.5l1.55 3.85 4.15.35-3.05 2.7z"/>
            </svg>
            <span>飞书扫码登录</span>
        </button>

        <p class="login-hint">
            仅限管理员白名单中的飞书账号可访问<br>
            如无权限请联系投研团队负责人
        </p>
    </div>

    <script>
        (function () {
            // Surface error from ?error= query string.
            var params = new URLSearchParams(window.location.search);
            var err = params.get('error');
            if (err) {
                var box = document.getElementById('error-box');
                box.textContent = decodeURIComponent(err);
                box.classList.add('visible');
            }

            var next = params.get('next') || '';
            var btn = document.getElementById('login-btn');
            btn.addEventListener('click', async function () {
                btn.disabled = true;
                btn.querySelector('span').textContent = '正在跳转飞书...';
                try {
                    var url = '/api/auth/login-url' + (next ? ('?next=' + encodeURIComponent(next)) : '');
                    var resp = await fetch(url, { credentials: 'same-origin' });
                    if (!resp.ok) {
                        var body = await resp.json().catch(function () { return {}; });
                        throw new Error(body.error || ('HTTP ' + resp.status));
                    }
                    var data = await resp.json();
                    if (!data.url) throw new Error('未获取到跳转地址');
                    window.location.href = data.url;
                } catch (e) {
                    var box = document.getElementById('error-box');
                    box.textContent = '登录失败：' + e.message;
                    box.classList.add('visible');
                    btn.disabled = false;
                    btn.querySelector('span').textContent = '飞书扫码登录';
                }
            });
        })();
    </script>
</body>
</html>
