services:
  gobivc:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      - PORT=8080
    volumes:
      - gobivc-data:/app/data
    restart: unless-stopped

volumes:
  gobivc-data:
