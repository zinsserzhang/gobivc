services:
  gobivc:
    build: .
    ports:
      - "8080:8080"
    environment:
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL:-MiniMax-M2.7}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.minimaxi.com/v1}
      - API_TOKEN=${API_TOKEN}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-*}
      - PORT=8080
      - DATA_DIR=/app/data
      # Feishu integration (optional)
      - FEISHU_APP_ID=${FEISHU_APP_ID}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET}
      - FEISHU_BASE_URL=${FEISHU_BASE_URL:-https://open.feishu.cn/open-apis}
      # Legacy Claude support (when AI_PROVIDER=claude)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
    volumes:
      - gobivc-data:/app/data
    restart: unless-stopped

volumes:
  gobivc-data:
